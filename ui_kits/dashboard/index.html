<!-- @dsCard group="Dashboard" viewport="1440x900" name="Opofi Dashboard" subtitle="Trade and Invest workspaces · click-through · desktop 1440" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Opofi Dashboard</title><link rel="icon" type="image/svg+xml" href="../../assets/icon-cyan.svg"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;background:#060b14}#root{height:100%}</style></head>
<body class="opofi-root"><div id="root"></div>
<script type="text/babel" src="TradeScreens.jsx"></script>
<script type="text/babel" src="InvestScreens.jsx"></script>
<script type="text/babel" src="DetailScreens.jsx"></script>
<script type="text/babel">
const { AppShell, Sidebar, TopBar, Toast, EmptyState: Empty0, Button: Button0 } = window.OpofiDesignSystem_dbd458;
const TRADE_KEYS = ['dashboard','challenges','new','funded','signals','rules'];
const INVEST_KEYS = ['portfolio','products','positions','earnings','calendar','position','start'];
const CRUMBS = { dashboard:['Trade'], challenges:['Trade','My challenges'], new:['Trade','New challenge'], funded:['Trade','Funded & payouts'], portfolio:['Invest'], products:['Invest','Products'], earnings:['Invest','Earnings'], position:['My positions','Profit share'], wallet:['Wallet'] };
function App(){
  const [screen,setScreen]=React.useState(()=>localStorage.getItem('opofi-kit-screen')||'dashboard');
  const [panel,setPanel]=React.useState(null); const [toast,setToast]=React.useState(null);
  const ws = INVEST_KEYS.includes(screen)?'invest':TRADE_KEYS.includes(screen)?'trade':'shared';
  const go=(k)=>{ setScreen(k); localStorage.setItem('opofi-kit-screen',k); };
  const openPanel=(kind,arg)=>setPanel({kind,arg});
  const showToast=(m)=>{ setToast(m); setTimeout(()=>setToast(null),3000); };
  const sidebarWs = ws==='invest'?'invest':'trade';
  const active = screen==='position'||screen==='positions'?'positions':screen==='start'?'products':screen;
  let body;
  switch(screen){
    case 'dashboard': body=<TradeDashboard go={go} openPanel={openPanel}/>; break;
    case 'challenges': body=<TradeChallenges go={go}/>; break;
    case 'new': body=<TradeNewChallenge openPanel={openPanel}/>; break;
    case 'funded': body=<TradeFunded openPanel={openPanel}/>; break;
    case 'portfolio': body=<InvestPortfolio go={go} openPanel={openPanel}/>; break;
    case 'products': case 'start': body=<InvestProducts go={go}/>; break;
    case 'earnings': body=<InvestEarnings/>; break;
    case 'position': case 'positions': body=<PositionDetail go={go} showToast={showToast}/>; break;
    case 'wallet': body=<WalletScreen openPanel={openPanel}/>; break;
    default: body=<Empty0 title={`${active.charAt(0).toUpperCase()+active.slice(1)} is not in this kit`} body="Only screens present in the redesign source are recreated." action={<Button0 size="sm" onClick={()=>go(sidebarWs==='invest'?'portfolio':'dashboard')}>Back to {sidebarWs==='invest'?'Portfolio':'Dashboard'}</Button0>}/>;
  }
  return <AppShell workspace={ws==='shared'?'shared':ws} density={sidebarWs} sidebar={<Sidebar workspace={sidebarWs} active={active} base="../../" onNavigate={go} onSwitchWorkspace={()=>go(sidebarWs==='invest'?'dashboard':'portfolio')}/>} topbar={<TopBar crumbs={CRUMBS[screen]||[sidebarWs==='invest'?'Invest':'Trade']} onAvailable={()=>go('wallet')}/>}>
    <div data-workspace={sidebarWs} style={{display:'contents'}}>{body}</div>
    {panel && <div data-workspace={ws==='shared'?'shared':ws}><FlowPanel kind={panel.kind} arg={panel.arg} onClose={()=>setPanel(null)} showToast={showToast}/></div>}
    {toast && <div style={{position:'fixed',right:24,bottom:24,zIndex:200}}><Toast onDismiss={()=>setToast(null)}>{toast}</Toast></div>}
  </AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
